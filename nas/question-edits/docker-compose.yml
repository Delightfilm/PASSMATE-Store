services:
  passmate-edit-assets:
    image: python:3.13-alpine
    container_name: passmate-edit-assets
    restart: unless-stopped
    user: "1000:10"
    read_only: true
    command: ["python", "-B", "/app/server.py"]
    environment:
      PASSMATE_EDIT_ASSET_TOKEN: ${PASSMATE_EDIT_ASSET_TOKEN:?private token required}
    volumes:
      - /volume2/PASSMATE/question-bank/question-edits/server.py:/app/server.py:ro
      - /volume2/PASSMATE/question-bank/question-edits/data:/data:rw
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m,uid=1000,gid=10"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [question-bank]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  question-bank:
    external: true
    name: passmate-question-bank
