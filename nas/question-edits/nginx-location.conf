# Append inside existing question-bank server; preserve all current routes.
location ^~ /edit-assets/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $edit_origin http://passmate-edit-assets:8091;
    rewrite ^/edit-assets/(.*)$ /$1 break;
    proxy_pass $edit_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    client_max_body_size 5m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except PUT { deny all; }
}
location ~ "^/admin-images/([a-f0-9]{64})\.png$" {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $asset_origin http://passmate-edit-assets:8091;
    set $asset_key $1;
    proxy_pass $asset_origin/assets/$asset_key.png;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
