# Add INSIDE the existing question-bank server block (do not replace its public routes).
# Token verification happens in the private cache service. No public listing/writes.
location ^~ /ai-cache/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ai_cache_origin http://passmate-ai-cache:8090;
    rewrite ^/ai-cache/(.*)$ /$1 break;
    proxy_pass $ai_cache_origin;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    client_max_body_size 32k;
    proxy_request_buffering on;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET POST { deny all; }
}
