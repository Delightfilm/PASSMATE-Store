      }
      function wrong(){
        return `${siteHeader()}<div class="container page"><div class="page-heading"><div><div class="eyebrow">다시 보는 문제</div><h1>오답노트 <span style="color:var(--blue)">138문항</span></h1><p>틀린 문제를 골라 다시 풀어 보세요.</p></div><button class="primary" data-screen="exam-a">이 목록 20문항 풀기</button></div><div class="wrong-filter"><button class="meta-chip" data-action="filter">종목 · 전체 ⌄</button><button class="meta-chip" data-action="filter">과목 · 전체 ⌄</button><button class="meta-chip" data-action="filter">기간 · 전체 ⌄</button><button class="meta-chip" data-action="sort">${state.wrongSort} ⌄</button></div><section class="card pad"><div class="wrong-card-head"><h2 style="margin:0">최근 틀린 문제</h2><span class="meta-chip">20개씩 보기</span></div>${[1,2,3,4].map((n)=>`<div class="wrong-row"><label class="wrong-check"><input type="checkbox" aria-label="예시 오답 ${n}번 선택"></label><div><span class="subject-chip">${subjects[(n-1)%3]}</span> <span class="meta-chip" style="color:var(--error);background:var(--error-soft)">${n===1?'3회':'2회'} 틀림</span><p class="${state.wrongExpanded.has(n)?'expanded':''}">예시 문제 ${n}번입니다. 다시 학습할 내용을 이 자리에 두 줄까지 보여줍니다. 실제 문제나 해설은 포함하지 않습니다. 버튼을 누르면 요약 문장이 모두 펼쳐집니다.</p><button class="read-more" data-action="expand" data-row="${n}">${state.wrongExpanded.has(n)?'접기':'문제 펼치기'}</button></div><div class="wrong-actions"><button class="secondary" data-screen="exam-a">다시 풀기</button><button class="read-more" data-action="explain">해설</button><button class="icon-button more" data-action="more" data-row="${n}" aria-label="메모 및 삭제 메뉴">⋯</button></div><button class="secondary mobile-retry" data-screen="exam-a">다시 풀기</button>${state.wrongMenu===n?`<div class="wrong-menu"><button data-action="memo">메모 보기</button><button data-action="delete-mock">삭제 예시</button></div>`:''}</div>`).join('')}<small id="wrong-feedback" aria-live="polite">${state.wrongMessage}</small><button class="ghost" data-action="more-rows" style="width:100%;margin-top:16px">더 보기</button></section></div>${mobileTabs()}`;
      }
      function modal(kind){
        const config={start:['시작 확인','지금 시험을 시작할까요?','시작하면 제한시간이 흐릅니다. 이 시안에서는 실제 타이머가 작동하지 않습니다.','취소','시작 확정','detail','exam-a'],submit:['최종 제출','답안을 제출할까요?',`미응답 ${left()}문항이 있습니다. 이 시안에서는 실제로 제출되지 않습니다.`,'취소','제출','review','result'],expired:['시간 종료','시간이 종료되었습니다. 결과를 저장할까요?','나중에를 선택해도 이 시안의 응답 상태는 바뀌지 않습니다.','나중에','결과 저장하고 보기','exam-a','result']}[kind];
        return `<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-description"><div class="modal-icon" aria-hidden="true">${kind==='expired'?'◷':'✓'}</div><h2 id="modal-title">${config[1]}</h2><p id="modal-description">${config[2]}</p><div class="button-row"><button class="ghost" data-screen="${config[5]}">${config[3]}</button><button class="primary" data-screen="${config[6]}" data-confirm="${kind}">${config[4]}</button></div></section></div>`;
      }
      function sheet(){
        return `<div class="sheet-backdrop" data-action="sheet" aria-hidden="true"></div><section class="sheet-panel" role="dialog" aria-modal="true" aria-label="전체 답안지"><div class="sheet-head"><h2 style="margin:0">전체 답안지</h2><button class="icon-button" data-action="sheet" aria-label="답안지 닫기">×</button></div><p>60문항 중 ${answered()}문항 응답 · ${state.flagged.size}문항 나중에 보기</p>${state.screen==='exam-a'?subjects.map((s,i)=>`<h3>${s} · ${i*20+1}–${i*20+20}</h3>${answerRows(i*20+1,i*20+20)}`).join(''):subjects.map((s,i)=>`<h3>${s} · ${i*20+1}–${i*20+20}</h3><div class="number-grid">${Array.from({length:20},(_,j)=>i*20+j+1).map(n=>`<button class="${state.answers[n]?'answered':''} ${state.flagged.has(n)?'flagged':''} ${n===state.question?'current':''}" data-question="${n}" aria-label="${n}번 문제로 이동">${n}${state.flagged.has(n)?'◇':''}</button>`).join('')}</div>`).join('')}${legend()}</section>`;
      }
      function render(){
        const app=$('#app'),base=state.screen==='start'?'detail':state.screen==='submit'?'review':state.screen==='expired'?'exam-a':state.screen;
        const views={detail,guide,'exam-a':()=>exam('a'),'exam-b':()=>exam('b'),review,result,builder,wrong};
        app.innerHTML=(views[base]||detail)()+(['start','submit','expired'].includes(state.screen)?modal(state.screen):'')+(state.sheet?sheet():'')+(state.notice?'<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="개인 학습 안내"><h2>개인 학습 안내</h2><p>허락 없는 복제·배포는 금지됩니다. 문제와 해설은 개인 학습용으로 이용해 주세요.</p><button class="primary" data-action="notice">확인</button></section></div>':'');
        $('#stage').classList.toggle('mobile',state.view==='mobile');
        $('#screen-select').innerHTML=screens.map(([v,t])=>`<option value="${v}" ${state.screen===v?'selected':''}>${t}</option>`).join('');
        document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));
        if(['start','submit','expired'].includes(state.screen)||state.notice){requestAnimationFrame(()=>$('.modal .primary')?.focus())}
      }
      function navigate(screen){
        if(!screens.some(([v])=>v===screen))return;
        state.screen=screen;state.settings=false;state.sheet=false;state.account=false;
        history.replaceState(null,'','#'+screen);
        render();window.scrollTo({top:0,behavior:'instant'});
      }
      document.addEventListener('click',event=>{
        const el=event.target.closest('button');if(!el)return;
        if(el.dataset.screen){if(el.dataset.confirm==='expired')state.expiredResult=true;navigate(el.dataset.screen);return}
        if(el.dataset.view){state.view=el.dataset.view;if(state.view==='mobile'&&state.layout==='two')state.layout='one';render();return}
        if(el.dataset.question){state.question=Number(el.dataset.question);state.sheet=false;if(el.dataset.returnExam)state.screen='exam-a';render();return}
        if(el.dataset.answer){state.answers[Number(el.dataset.q)]=Number(el.dataset.answer);render();return}
        if(el.dataset.font){state.font=el.dataset.font;state.settings=true;render();return}
        if(el.dataset.layout){state.layout=el.dataset.layout;state.settings=true;render();return}
        if(el.dataset.year){state.selectedYears.has(el.dataset.year)?state.selectedYears.delete(el.dataset.year):state.selectedYears.add(el.dataset.year);render();return}
        if(el.dataset.source){state.source=el.dataset.source;render();return}
        switch(el.dataset.action){
          case 'previous-screen':navigate(screens[(screens.findIndex(([v])=>v===state.screen)-1+screens.length)%screens.length][0]);break;
          case 'next-screen':navigate(screens[(screens.findIndex(([v])=>v===state.screen)+1)%screens.length][0]);break;
          case 'ready':navigate(state.guideChecked?'guide':'start');break;
          case 'guide-prev':state.guideStep===1?navigate('detail'):(state.guideStep--,render());break;
          case 'guide-next':state.guideStep===4?navigate('start'):(state.guideStep++,render());break;
          case 'prev-question':state.question=Math.max(1,state.question-1);render();break;
          case 'next-question':state.question=Math.min(60,state.question+1);render();break;
          case 'flag':state.flagged.has(state.question)?state.flagged.delete(state.question):state.flagged.add(state.question);render();break;
          case 'timer':state.timer={normal:'ten',ten:'five',five:'normal'}[state.timer];render();break;
          case 'settings':state.settings=!state.settings;render();break;
          case 'sheet':state.sheet=!state.sheet;render();break;
          case 'grading':state.grading=!state.grading;render();break;
          case 'notice':state.notice=!state.notice;render();break;
          case 'account':state.account=!state.account;render();break;
          case 'save-builder':state.builderSaved=true;render();break;
          case 'saved':el.textContent='저장됨 ✓';break;
          case 'sort':state.wrongSort=state.wrongSort==='최근 틀린 순'?'많이 틀린 순':'최근 틀린 순';render();break;
          case 'expand':state.wrongExpanded.has(Number(el.dataset.row))?state.wrongExpanded.delete(Number(el.dataset.row)):state.wrongExpanded.add(Number(el.dataset.row));render();break;
          case 'more':state.wrongMenu=state.wrongMenu===Number(el.dataset.row)?0:Number(el.dataset.row);render();break;
          case 'memo':state.wrongMessage='메모 입력은 이 정적 시안에서 제공하지 않습니다.';render();break;
          case 'delete-mock':state.wrongMessage='삭제 동작은 이 정적 시안에서 실행되지 않습니다.';render();break;
          case 'bookmark':case 'filter':case 'explain':case 'more-rows':el.setAttribute('aria-label','시안용 동작 예시');break;
        }
      });
      document.addEventListener('change',event=>{
        const el=event.target;
        if(el.id==='screen-select'){navigate(el.value)}
        if(el.id==='guide-check'){state.guideChecked=el.checked;render()}
        if(el.id==='expired-toggle'){state.expiredResult=el.checked;render()}
        if(el.dataset.count!==undefined){state.builderCounts[Number(el.dataset.count)]=Math.max(0,Number(el.value)||0);render()}
      });
      document.addEventListener('keydown',event=>{
        const dialog=document.querySelector('[role="dialog"][aria-modal="true"]');
        if(event.key==='Tab'&&dialog){
          const items=[...dialog.querySelectorAll('button:not([disabled]),input,select')];
          if(items.length){
            if(event.shiftKey&&document.activeElement===items[0]){items.at(-1).focus();event.preventDefault()}
            else if(!event.shiftKey&&document.activeElement===items.at(-1)){items[0].focus();event.preventDefault()}
          }
        }
        if(event.key==='Escape'){
          if(state.sheet){state.sheet=false;render()}
          else if(state.notice){state.notice=false;render()}
          else if(state.settings){state.settings=false;render()}
          else if(state.account){state.account=false;render()}
          else if(state.screen==='start')navigate('detail');
          else if(state.screen==='submit')navigate('review');
          else if(state.screen==='expired')navigate('exam-a');
        }
      });
      const initial=location.hash.slice(1);if(screens.some(([v])=>v===initial))state.screen=initial;
      render();
    })();
  </script>
</body>
</html>
